<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

    <link rel="stylesheet" href="./style.css">
    <title>weather app</title>
</head>

<body>


    <div class="container mt-5">
        <h2 class="mb-4">Weather Forecast App</h2>

        <!-- Basic Search Bar -->
        <div class="mb-4 d-flex">


            <input class="form-control me-2" type="search" placeholder="Enter Your Location" id="location-name"
                aria-label="Search">
            <button class="btn btn-outline-success" onclick="getWeatherDetails(event);">Search</button>

        </div>
        <div id="details">
            <img src="" alt="">
        </div>










    </div>


    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="./script.js"></script>

</html>
